[project]
name = "pwpolicy"
version = "0.1.0"
description = "A small language for describing password policies, with a validating parser and pretty printer"
requires-python = ">=3.9"
authors = [{ name = "kmartinez6" }]
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
